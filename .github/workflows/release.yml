name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release versiyasi (tag, masalan: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: apk_asset
        run: |
          SRC_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Release APK not found, fallback to debug..."
            ./gradlew assembleDebug --no-daemon
            SRC_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi

          # Determine tag name
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0"
          fi

          OUTPUT_APK="app/build/outputs/apk/yurak-android-${TAG_NAME}.apk"
          cp "$SRC_APK" "$OUTPUT_APK"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "Prepared APK asset: $OUTPUT_APK for tag: $TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_asset.outputs.tag_name }}
          name: "Yurak Android ${{ steps.apk_asset.outputs.tag_name }}"
          files: ${{ steps.apk_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

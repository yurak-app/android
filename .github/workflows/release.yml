name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: apk_asset
        run: |
          SRC_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Release APK not found, fallback to debug..."
            ./gradlew assembleDebug --no-daemon
            SRC_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          
          # Extract tag name or fallback to version
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="latest"
          fi
          
          OUTPUT_APK="app/build/outputs/apk/yurak-android-${TAG_NAME}.apk"
          cp "$SRC_APK" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "Prepared APK asset: $OUTPUT_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.apk_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
